# Board automation for this repo, from task-mgmt.
#
#   - When a pull request merges: GitHub closes each issue it names with a closing keyword, even
#     when another open pull request closes the same issue, and the board's "Item closed"
#     workflow sets Done. `board guard` keeps the board Status right: In Review while another
#     closing pull request is open, then Done (Pending Release on a tag-release board) once the
#     last one merges. The issue itself stays closed.
#   - When a release is published (repos that release by tag): `board release` moves this repo's
#     Pending Release items whose merged pull requests are in the tag to Done.
#
# Needs, in the repo's (or its organization's) Actions settings:
#   - a token that can write to the board, which the default GITHUB_TOKEN can't. Either:
#       - variable BOARD_APP_ID and secret BOARD_APP_KEY: a GitHub App installed on the
#         organization and the repos that feed the board, with organization Projects read and
#         write and repository Issues, Pull requests and Contents read; the job mints a
#         short-lived token each run (the choice for an organization board), or
#       - secret BOARD_TOKEN: a personal access token with the repo and project scopes (the
#         choice for a user board, which GitHub Apps can't reach). When both are set, the App wins.
#     The App token covers every repo the App is installed on, not just this one: the board
#     command reads items from every repo on the board.
#   - variable BOARD_CONFIG: the JSON of the board config (as in ~/.config/board/boards.json),
#     with this repo listed in its board's "repos".
#   - variable BOARD_REF: the task-mgmt commit to take the board command from, as a full commit SHA.
#     The job runs that command with the board token, so pin it and bump it deliberately.
#     Unset, the job takes task-mgmt's main and warns.
# Without a token or BOARD_CONFIG the job warns what's missing and passes. GitHub withholds
# secrets from fork pull requests and from merges Dependabot makes itself, so those skip with a
# notice; run `board guard owner/repo#N` by hand for those.
name: board

on:
  pull_request:
    types: [closed]
  release:
    types: [published]

permissions: {}

jobs:
  board:
    if: github.event_name == 'release' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.BOARD_APP_KEY != '' }}
      BOARD_CONFIG: ${{ github.workspace }}/.board.json
      BOARD_REF: ${{ vars.BOARD_REF || 'main' }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Mint a GitHub App token
        id: app
        if: vars.BOARD_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Check the token and config
        id: ready
        env:
          TOKEN: ${{ steps.app.outputs.token || secrets.BOARD_TOKEN }}
          CONFIG_JSON: ${{ vars.BOARD_CONFIG }}
          PINNED: ${{ vars.BOARD_REF }}
          NO_SECRETS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="a token (BOARD_APP_ID and BOARD_APP_KEY, or BOARD_TOKEN)"
          [ -n "$CONFIG_JSON" ] || missing="${missing:+$missing and }the BOARD_CONFIG variable"
          if [ -n "$missing" ] && [ "$NO_SECRETS" = true ]; then
            echo "::notice title=Board automation skipped::GitHub withholds secrets from fork pull requests and from merges by Dependabot; run board guard $REPO#$PR_NUMBER by hand if this one closes an issue."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::warning title=Board automation skipped::Set $missing in the repo's Actions settings."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            [[ "$PINNED" =~ ^[0-9a-f]{40}$ ]] || echo "::warning title=Board command not pinned::Set the BOARD_REF variable to a full guide commit SHA; this run takes ${PINNED:-main}, which can move."
          fi
      - name: Install the board command
        if: steps.ready.outputs.go == 'true'
        env:
          CONFIG_JSON: ${{ vars.BOARD_CONFIG }}
        run: |
          printf '%s' "$CONFIG_JSON" > "$BOARD_CONFIG"
          curl -fsSL "https://raw.githubusercontent.com/armodis-ai/task-mgmt/${BOARD_REF}/template/board/.local/bin/board" -o "$RUNNER_TEMP/board"
          chmod +x "$RUNNER_TEMP/board"
      - name: Keep the board Status right for issues this merge closed
        if: steps.ready.outputs.go == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.BOARD_TOKEN }}
        run: |
          rc=0; "$RUNNER_TEMP/board" guard "$REPO#$PR_NUMBER" || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]
      - name: Move released items to Done
        if: steps.ready.outputs.go == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.BOARD_TOKEN }}
        run: |
          board_name=$(python3 -c 'import json,os,sys; c=json.load(open(os.environ["BOARD_CONFIG"])); r=sys.argv[1]; print(next((n for n,b in c["boards"].items() if r in b.get("repos",[])), ""))' "$REPO")
          if [ -z "$board_name" ]; then
            echo "::error title=Repo on no board::$REPO is in no board's repos in BOARD_CONFIG."
            exit 1
          fi
          rc=0; "$RUNNER_TEMP/board" release "$board_name" "$REPO" "$TAG" || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]
