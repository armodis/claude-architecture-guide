# substrate.conf — the one place you configure your setup.
# Sourced by both setup.sh and verify.sh. Edit this; leave the scripts alone.

# The domains you work across. Each becomes ~/<domain>/ with its own root
# CLAUDE.md (Layer 1). Rename, add, or remove freely.
DOMAINS=(work personal)

# Shell/git dotfile packages under template/ to stow into ~/. Set to () to skip.
STOW_PACKAGES=(bash git)

# Optional skill overlays: aggregate the .claude/ tree from an external repo
# into ~/<domain>/.claude/ via per-file symlinks, so launching from the domain
# root sees skills that live in a sibling repo. Format: "domain:/abs/path/.claude"
# Repeatable. Leave empty to skip.
SKILL_OVERLAYS=()
# example:
# SKILL_OVERLAYS=(
#   "work:$HOME/work/team-repo/.claude"
# )
